name: Check published plugin installation metadata
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to inspect
        type: choice
        default: npm
        options: [npm, github-packages]
      version:
        description: 'Exact version or next/latest; empty uses release-config'
        type: string
        default: ''
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
      - name: Compare registry preflight with the exact published tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TARGET: ${{ inputs.registry }}
          REGISTRY_VERSION: ${{ inputs.version }}
        run: node tools/registry-inspect.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: registry-install-check
          path: .cache/registry-install-check/*.json
          if-no-files-found: warn
