name: Check published plugin installation metadata
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          registry-url: https://npm.pkg.github.com
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Compare registry preflight with the published manifest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache/registry-install-check
          cd .cache/registry-install-check
          for version in next 0.1.0; do
            pnpm view "@brucezhang1993/dsh-remote-everywhere@$version" name version description dsh --json --registry=https://npm.pkg.github.com --config.fetch-retries=0 > "$version.json"
          done
          npm pack @brucezhang1993/dsh-remote-everywhere@0.1.0 --ignore-scripts --json --registry=https://npm.pkg.github.com > pack.json
          tar -xOf brucezhang1993-dsh-remote-everywhere-0.1.0.tgz package/package.json > manifest.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const read = file => JSON.parse(readFileSync(file, 'utf8'))
          const manifest = read('manifest.json')
          const integrity = read('pack.json')[0].integrity
          assert.equal(integrity, 'sha512-EU8nze18Y6s6QAukGenS2ExInl/55Ajqr7nF4hE/wjCrvU+daYuGGkCbSTHPyQ11Rx5daxfvgnY9WXqRn+89tg==')
          assert.equal(manifest.dsh?.bundle?.patch, './cordis.patch.yml')
          for (const version of ['next', '0.1.0']) {
            const metadata = read(`${version}.json`)
            console.log(JSON.stringify({ spec: version, name: metadata.name, version: metadata.version, dsh: metadata.dsh ?? null, tarballDsh: manifest.dsh }))
            assert.equal(metadata.version, '0.1.0')
            assert.deepEqual(metadata.dsh, manifest.dsh, 'DSH registry preflight must see the published bundle declaration')
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: registry-install-check
          path: .cache/registry-install-check/*.json
          if-no-files-found: warn
