name: Build signed Android release
on:
  workflow_call:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    environment: mobile-signing
    timeout-minutes: 40
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - run: apt-get update && apt-get install -y git curl unzip xz-utils ca-certificates python3 jq openjdk-21-jdk
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build and verify the distribution APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_1: safe.directory
          GIT_CONFIG_VALUE_1: ${{ env.FLUTTER_ROOT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$(node --input-type=module -e 'import {releaseTag} from "./tools/release-config.mjs"; console.log(releaseTag)')"
          : "${KEYSTORE_BASE64:?configure ANDROID_KEYSTORE_BASE64 in mobile-signing}"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/dsh-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          bash tools/mobile-release.sh --inside-scope
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-release
          path: .cache/mobile-release/*
          if-no-files-found: error
          retention-days: 14
