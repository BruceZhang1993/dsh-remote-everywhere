name: Publish reviewed candidates to GitHub Packages
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish to next, or promote after registry installation acceptance
        type: choice
        required: true
        default: publish-next
        options:
          - publish-next
          - promote-latest
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: github-packages-release
  cancel-in-progress: false
jobs:
  verify:
    # A dispatch must select this release tag. No push/PR automatically publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-packages
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    permissions:
      contents: read
      packages: write
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.verify.outputs.github_artifact }}
          path: .cache/github-packages-${{ needs.verify.outputs.version }}
      - name: Verify provenance and execute the approved operation
        run: |
          case "$RELEASE_OPERATION" in
            publish-next) node tools/publish-packages.mjs --publish ;;
            promote-latest) node tools/publish-packages.mjs --promote ;;
            *) exit 2 ;;
          esac
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_RELEASE_APPROVED_SHA: ${{ vars.DSH_RELEASE_APPROVED_SHA }}
          DSH_RELEASE_PROMOTION_APPROVED_SHA: ${{ vars.DSH_RELEASE_PROMOTION_APPROVED_SHA }}
      - name: Verify fresh registry consumer installation
        if: inputs.operation == 'publish-next'
        run: bash tools/package-smoke.sh --registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.operation == 'publish-next'
        with:
          name: github-packages-${{ needs.verify.outputs.version }}-consumer
          path: |
            .cache/registry-${{ needs.verify.outputs.version }}/acceptance.json
            .cache/github-packages-${{ needs.verify.outputs.version }}/manifest.json
          if-no-files-found: warn
