name: Protocol, security and release checks
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl unzip xz-utils ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: pnpm test:fuzz-coverage
        env:
          DSH_FUZZ_SECONDS: '10'
      - working-directory: packages/core/dart
        run: dart pub get --enforce-lockfile && dart analyze && dart test && dart run bin/selftest.dart && dart run bin/verify_vectors.dart
      - run: pnpm test:interop
      - run: pnpm audit --prod
      - run: pnpm test:release-candidate --github-packages "$GITHUB_REPOSITORY"
      - run: node --test --test-concurrency=1 tools/test-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-packages-0.1.0-candidates
          path: |
            .cache/github-packages-0.1.0/*.tgz
            .cache/github-packages-0.1.0/manifest.json
          if-no-files-found: error
  android-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl unzip xz-utils ca-certificates python3 jq openjdk-21-jdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      - run: tools/android-gate.sh
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
          GIT_CONFIG_KEY_1: safe.directory
          GIT_CONFIG_VALUE_1: ${{ env.FLUTTER_ROOT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-android-aot-gate
          path: .cache/m1-android-gate.apk
