name: Protocol, security and release checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.protocol-core.outputs.version }}
      source_sha:
        value: ${{ jobs.protocol-core.outputs.source_sha }}
      npm_artifact:
        value: ${{ jobs.protocol-core.outputs.npm_artifact }}
      github_artifact:
        value: ${{ jobs.protocol-core.outputs.github_artifact }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  protocol-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      npm_artifact: ${{ steps.release.outputs.npm_artifact }}
      github_artifact: ${{ steps.release.outputs.github_artifact }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl unzip xz-utils ca-certificates python3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - id: release
        run: node tools/release-version.mjs --github-output
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash tools/check-workflows.sh
      - run: pnpm check && pnpm test
      - run: pnpm test:fuzz-coverage
        env:
          DSH_FUZZ_SECONDS: '10'
      - working-directory: packages/core/dart
        run: dart pub get --enforce-lockfile && dart analyze && dart test && dart run bin/selftest.dart && dart run bin/verify_vectors.dart
      - run: pnpm test:interop
      - run: bash tools/dart-fuzz.sh --inside-scope
        env:
          DSH_DART_FUZZ_SECONDS: '10'
      - run: python3 tools/test-dart-fuzz.py
      - run: pnpm audit --prod
      - name: Install the pinned browser for UI integration
        run: pnpm exec playwright install --with-deps chromium
      - name: Test npm tarballs, genuine hosts and the management UI
        run: DSH_UI_SMOKE=1 pnpm test:release-candidate --npm "$GITHUB_REPOSITORY"
      - name: Build separate GitHub Packages candidates
        run: node tools/release-candidate.mjs --github-packages "$GITHUB_REPOSITORY"
      - run: node --test --test-concurrency=1 tools/test-release.mjs tools/test-release-automation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.npm_artifact }}
          path: |
            ${{ steps.release.outputs.npm_directory }}/*.tgz
            ${{ steps.release.outputs.npm_directory }}/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.github_artifact }}
          path: |
            ${{ steps.release.outputs.github_directory }}/*.tgz
            ${{ steps.release.outputs.github_directory }}/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dart-state-fuzz-smoke
          path: .cache/dart-fuzz/*.json
          if-no-files-found: warn
  mobile:
    # Test/build the actual application; replaces the duplicate generated sample APK gate.
    uses: ./.github/workflows/mobile.yml
    secrets: inherit
