name: Bounded Node and Dart coverage-guided fuzz
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-fuzz
  cancel-in-progress: false
jobs:
  parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ubuntu:24.04
      options: --memory=8g --memory-swap=12g
    steps:
      - run: apt-get update && apt-get install -y git curl ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/coverage-fuzz/corpus.json
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - run: pnpm test:fuzz-coverage
        env:
          DSH_FUZZ_SECONDS: '900'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: node-parser-fuzz-${{ github.run_id }}
          path: .cache/coverage-fuzz/*.json
          if-no-files-found: error
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/dart-fuzz/corpus.json
          key: dart-fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dart-fuzz-corpus-${{ runner.os }}-
      - run: bash tools/dart-fuzz.sh --inside-scope
        env:
          DSH_DART_FUZZ_SECONDS: '900'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dart-state-fuzz-${{ github.run_id }}
          path: .cache/dart-fuzz/*.json
          if-no-files-found: error
